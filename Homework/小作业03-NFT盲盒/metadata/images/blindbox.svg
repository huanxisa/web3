<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#3f3d56"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Box body -->
  <rect x="100" y="160" width="200" height="160" rx="8" fill="url(#box)" stroke="#9d94ff" stroke-width="2"/>
  <!-- Box lid -->
  <rect x="90" y="130" width="220" height="40" rx="6" fill="#8b83ff" stroke="#9d94ff" stroke-width="2"/>
  <!-- Ribbon vertical -->
  <rect x="190" y="130" width="20" height="190" rx="4" fill="#f5a623" opacity="0.9"/>
  <!-- Ribbon horizontal -->
  <rect x="90" y="145" width="220" height="20" rx="4" fill="#f5a623" opacity="0.9"/>
  <!-- Question mark -->
  <text x="200" y="260" font-family="Arial" font-size="72" font-weight="bold" fill="white" opacity="0.4" text-anchor="middle">?</text>
  <!-- Stars -->
  <text x="60" y="80" font-family="Arial" font-size="24" fill="#f5a623" opacity="0.6"></text>
  <text x="320" y="100" font-family="Arial" font-size="16" fill="#9d94ff" opacity="0.6">&</text>
  <text x="340" y="320" font-family="Arial" font-size="20" fill="#f5a623" opacity="0.4"></text>
  <text x="50" y="340" font-family="Arial" font-size="12" fill="#9d94ff" opacity="0.5">&</text>
  <!-- Title -->
  <text x="200" y="370" font-family="Arial" font-size="18" font-weight="bold" fill="#9d94ff" text-anchor="middle">MYSTERY BOX</text>
</svg>
