<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e0a2e"/>
      <stop offset="100%" style="stop-color:#150622"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <polygon points="200,70 290,155 200,310 110,155" fill="#9c27b0" stroke="#ce93d8" stroke-width="2.5" filter="url(#glow)"/>
  <polygon points="200,70 290,155 200,185 110,155" fill="#ce93d8" stroke="#e1bee7" stroke-width="1" opacity="0.8"/>
  <polygon points="200,70 265,145 200,162 135,145" fill="#e1bee7" opacity="0.5"/>
  <!-- Inner shine -->
  <polygon points="200,90 240,145 200,155 160,145" fill="white" opacity="0.15"/>
  <!-- Sparkles -->
  <text x="80"  y="110" font-family="Arial" font-size="22" fill="#ce93d8" opacity="0.7">&</text>
  <text x="300" y="160" font-family="Arial" font-size="18" fill="#e1bee7" opacity="0.7">&</text>
  <text x="100" y="280" font-family="Arial" font-size="14" fill="#9c27b0" opacity="0.6">&</text>
  <text x="295" y="270" font-family="Arial" font-size="20" fill="#ce93d8" opacity="0.5"></text>
  <rect x="115" y="330" width="170" height="36" rx="18" fill="#9c27b0" opacity="0.4"/>
  <text x="200" y="353" font-family="Arial" font-size="16" font-weight="bold" fill="#e1bee7" text-anchor="middle">EPIC</text>
  <text x="200" y="375" font-family="Arial" font-size="14" fill="#ce93d8" text-anchor="middle"></text>
</svg>
