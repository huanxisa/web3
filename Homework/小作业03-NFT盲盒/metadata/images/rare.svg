<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2e"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <polygon points="200,80 280,160 200,300 120,160" fill="#2196f3" stroke="#64b5f6" stroke-width="2" filter="url(#glow)"/>
  <polygon points="200,80 280,160 200,180 120,160" fill="#64b5f6" stroke="#90caf9" stroke-width="1" opacity="0.8"/>
  <polygon points="200,80 260,150 200,160 140,150" fill="#90caf9" opacity="0.5"/>
  <!-- Sparkles -->
  <text x="100" y="130" font-family="Arial" font-size="20" fill="#64b5f6" opacity="0.6">&</text>
  <text x="280" y="200" font-family="Arial" font-size="16" fill="#90caf9" opacity="0.6">&</text>
  <rect x="120" y="330" width="160" height="36" rx="18" fill="#2196f3" opacity="0.3"/>
  <text x="200" y="353" font-family="Arial" font-size="16" font-weight="bold" fill="#90caf9" text-anchor="middle">RARE</text>
  <text x="200" y="375" font-family="Arial" font-size="14" fill="#2196f3" text-anchor="middle"></text>
</svg>
