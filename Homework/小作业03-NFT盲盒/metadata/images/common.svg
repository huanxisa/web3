<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2a2a3e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Gem shape -->
  <polygon points="200,80 280,160 200,300 120,160" fill="#9e9e9e" stroke="#bdbdbd" stroke-width="2"/>
  <polygon points="200,80 280,160 200,180 120,160" fill="#bdbdbd" stroke="#e0e0e0" stroke-width="1" opacity="0.7"/>
  <!-- Rarity label -->
  <rect x="120" y="330" width="160" height="36" rx="18" fill="#9e9e9e" opacity="0.3"/>
  <text x="200" y="353" font-family="Arial" font-size="16" font-weight="bold" fill="#e0e0e0" text-anchor="middle">COMMON</text>
  <!-- Stars -->
  <text x="200" y="370" font-family="Arial" font-size="14" fill="#9e9e9e" text-anchor="middle"></text>
