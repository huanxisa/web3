[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
ast = true              # openzeppelin-foundry-upgrades 需要 AST 分析存储布局
ffi = true              # openzeppelin-foundry-upgrades 调用 npx 外部命令时需要
build_info = true       # 生成完整编译器输入输出，OZ CLI 校验时需要
extra_output = ["storageLayout"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
    "openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
]

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=11155111" }
