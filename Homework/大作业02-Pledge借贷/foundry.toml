[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
ast = true
build_info = true
extra_output = ["storageLayout"]
via_ir = true
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 1000

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "sepolia" }
